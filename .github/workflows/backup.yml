# Nightly encrypted backups of production data. See docs/backups.md.
# Adapted from HangarBook's backup workflow. Nothing runs until the repository
# variable BACKUP_ENABLED is set to "true" (Settings > Secrets and variables >
# Actions > Variables), after the setup in docs/backups.md.
name: Nightly backup

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  database:
    # From main only. The backup environment is limited to main as well (see
    # docs/backups.md), so a workflow changed on another branch cannot reach
    # its secrets either.
    if: github.ref == 'refs/heads/main' && vars.BACKUP_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: backup
    # An empty Postgres on this runner alone. Every dump is restored into it
    # and compared with the database before anything is uploaded.
    services:
      verify:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install the Postgres 18 tools and age
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common age jq
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"

      - name: Dump, restore and check, encrypt, upload
        run: scripts/backup-db.sh
        env:
          BACKUP_PREFIX: lifestory
          BACKUP_ACCOUNTS_TABLE: users
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_VERIFY_URL: postgres://postgres:verify@127.0.0.1:5432/postgres
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
          BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
          BACKUP_S3_ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
          AWS_DEFAULT_REGION: ${{ vars.BACKUP_S3_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET }}

  files:
    # The uploaded files in the Production Blob store, into the same bucket.
    if: github.ref == 'refs/heads/main' && vars.BACKUP_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: backup
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Only to load @vercel/blob at the version the app uses. No install
      # scripts run, and no secret is present in this step.
      - name: Install dependencies
        run: corepack enable && pnpm install --frozen-lockfile --ignore-scripts

      - name: Install age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age jq

      # Which files are already in the bucket, so unchanged files are not
      # uploaded every night. Losing this cache only means uploading again.
      - uses: actions/cache@v4
        with:
          path: .backup-seen
          key: blob-backup-seen-${{ github.run_id }}
          restore-keys: blob-backup-seen-

      - name: Copy the store, check, encrypt, upload
        run: scripts/backup-blobs.sh
        env:
          BACKUP_PREFIX: lifestory
          BACKUP_SEEN_FILE: .backup-seen
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BACKUP_BLOB_READ_WRITE_TOKEN }}
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
          BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
          BACKUP_S3_ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
          AWS_DEFAULT_REGION: ${{ vars.BACKUP_S3_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET }}
